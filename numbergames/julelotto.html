<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Numbergames - Jule Lotto | DS flow</title>
    <link rel="icon" type="image/svg+xml" href="https://danskespil.dk/favicon.ico">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700" rel="stylesheet">
    <link rel="stylesheet" href="../mermaid.css">
    <style>
        .flow {
            width: max-content;
            margin: 0 auto;
            padding: 32px 32px 40px;
            border-radius: 16px;
            background: radial-gradient(circle, #d5d8e2 1px, transparent 1.4px) 0 0 / 18px 18px, #f8f9fc;
        }

        .flow__grid {
            position: relative;
            display: grid;
            column-gap: 56px;
            row-gap: 80px;
            align-items: start;
            justify-items: center;
        }

        .flow__edges {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .flow__edge {
            fill: none;
            stroke: #a3a9bd;
            stroke-width: 1.75;
            transition: stroke 0.2s, stroke-width 0.2s;
        }

        .flow__edge--dashed {
            stroke-dasharray: 6 5;
        }

        .flow__edge--active {
            stroke: #c50005;
            stroke-width: 2.5;
        }

        .flow__arrow {
            fill: #a3a9bd;
        }

        .flow__arrow--active {
            fill: #c50005;
        }

        .flow__node {
            position: relative;
            z-index: 1;
            width: 216px;
            margin: 0;
            padding: 8px;
            border-radius: 12px;
            background-color: #fff;
            box-shadow: 0 1px 3px rgba(20, 20, 40, 0.08), 0 4px 14px rgba(20, 20, 40, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .flow__node:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 6px rgba(20, 20, 40, 0.1), 0 10px 24px rgba(20, 20, 40, 0.14);
        }

        .flow__node--placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 96px;
            border: 2px dashed currentColor;
            box-shadow: none;
        }

        .flow__node--missing {
            color: #b3141a;
            background: repeating-linear-gradient(135deg, #fff5f5 0 10px, #ffeaea 10px 20px);
        }

        .flow__node--missing-dark {
            color: #7a0000;
            background: repeating-linear-gradient(135deg, #f9e6e6 0 10px, #f2d4d4 10px 20px);
        }

        .flow__node--pending {
            color: #b35c00;
            background: repeating-linear-gradient(135deg, #fff8eb 0 10px, #ffeccc 10px 20px);
        }

        .flow__badge {
            position: absolute;
            top: -10px;
            left: 12px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #c50005, #e5383b);
            box-shadow: 0 2px 6px rgba(197, 0, 5, 0.3);
        }

        .flow__zoom {
            display: block;
            padding: 0;
            border: 0;
            border-radius: 6px;
            overflow: hidden;
            background: none;
            cursor: zoom-in;
        }

        .flow__image {
            display: block;
            width: 200px;
            height: auto;
        }

        .flow__label {
            margin: 8px 4px 2px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .flow__node--placeholder .flow__label {
            margin: 0;
            padding: 0 8px;
        }

        .flow__labels {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .flow__edge-label {
            position: absolute;
            padding: 3px 10px;
            border: 1px solid #dfe2ec;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            color: #3b3b45;
            background-color: #fff;
            box-shadow: 0 1px 3px rgba(20, 20, 40, 0.08);
            transform: translate(-50%, -50%);
            transition: color 0.2s, border-color 0.2s;
        }

        .flow__edge-label--active {
            border-color: #c50005;
            color: #c50005;
        }

        .lightbox {
            max-width: 92vw;
            max-height: 92vh;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .lightbox::backdrop {
            background-color: rgba(20, 20, 30, 0.7);
        }

        .lightbox__figure {
            margin: 0;
        }

        .lightbox__image {
            display: block;
            max-width: min(1200px, 85vw);
            max-height: 80vh;
            border-radius: 6px;
        }

        .lightbox__caption {
            margin-top: 12px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
        }

        .lightbox__close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            font-size: 20px;
            line-height: 1;
            color: #2a2a2e;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
    </style>
</head>

  const flows = {

        { id: 'Lotto_ReceiptWithJuleLotto', row: 7, col: 2, label: 'To kvitteringer - Lotto + Jule Lotto', status: 'missing' },
        { id: 'LottoWeekAndJuleLotto_Info', row: 4, col: 3, label: 'Info om Jule Lotto popup', status: 'missing-dark' },
        { id: 'LottoWeekAndJuleLotto_Joker', row: 5, col: 3, label: 'Joker tilvalg', status: 'missing' },
        { id: 'LottoWeekAndJuleLotto_Confirm', row: 6, col: 3, img: 'week51-landingpage-lotto-rows-weeks-julelotto-info-joker-confirm.png', h: 125, label: 'Bekræftside' },
        { id: 'LottoWeekAndJuleLotto_Receipt', row: 7, col: 3, label: 'En kvittering - Lotto + Jule Lotto', status: 'missing' },
        { id: 'JuleLotto_Info', row: 2, col: 4, img: 'week51-landingpage-julelotto-onboarding.png', h: 125, label: 'Jule Lotto onboarding' },
        { id: 'JuleLotto_Confirm', row: 3, col: 4, img: 'week51-landingpage-julelotto-onboarding-confirm.png', h: 125, label: 'Bekræftside' },
        { id: 'JuleLotto_Receipt', row: 4, col: 4, img: 'week51-landingpage-julelotto-onboarding-confirm-receipt.png', h: 166, label: 'En kvittering - Jule Lotto' },
      ],
      // [from, to, label, dashed]
      edges: [
        ['TopSpot', 'Lotto_JuleLottoPopover', 'Køb nu - 10 rækker'],
        ['LandingPage', 'Lotto_Rows', 'Lotto'],
        ['Lotto_Rows', 'Lotto_Weeks', '10 rækker'],
        ['Lotto_Weeks', 'Lotto_JuleLottoPopover', '1 uge'],
        ['Lotto_JuleLottoPopover', 'Lotto_Joker', 'Nej tak', true],
        ['Lotto_JuleLottoPopover', 'Lotto_JokerWithJuleLotto', 'Ja tak', true],
        ['Lotto_Joker', 'Lotto_Confirm', 'Nej tak'],
        ['Lotto_JokerWithJuleLotto', 'Lotto_ConfirmWithJuleLotto', 'Nej tak'],
        ['Lotto_Confirm', 'Lotto_Receipt', 'Bekræft'],
        ['Lotto_ConfirmWithJuleLotto', 'Lotto_ReceiptWithJuleLotto', 'Bekræft'],
        ['Lotto_Weeks', 'LottoWeekAndJuleLotto_Info', '1 uge og Jule Lotto'],
        ['LottoWeekAndJuleLotto_Info', 'LottoWeekAndJuleLotto_Joker', 'Næste', true],
        ['LottoWeekAndJuleLotto_Joker', 'LottoWeekAndJuleLotto_Confirm', 'Nej tak'],
        ['LottoWeekAndJuleLotto_Confirm', 'LottoWeekAndJuleLotto_Receipt', 'Bekræft'],
        ['LandingPage', 'JuleLotto_Info', 'Jule Lotto'],
        ['JuleLotto_Info', 'JuleLotto_Confirm', 'Næste'],
        ['JuleLotto_Confirm', 'JuleLotto_Receipt', 'Bekræft'],
      ],
    },
    week52: {
      nodes: [
        { id: 'TopSpot', row: 1, col: 1, img: 'week52-topspot.png', h: 168, label: 'Top Spot', start: true },
        { id: 'LandingPage', row: 1, col: 3, img: 'week52-landingpage.png', h: 168, label: 'Landing page', start: true },
        { id: 'Lotto_Rows', row: 2, col: 2, img: 'week52-landingpage-lotto-rows.png', h: 172, label: 'Antal rækker' },
        { id: 'Lotto_Weeks', row: 3, col: 2, img: 'week52-landingpage-lotto-rows-weeks.png', h: 113, label: 'Antal uger' },
        { id: 'LottoJuleLotto_Info', row: 4, col: 1, span: 2, img: 'week52-landingpage-lotto-rows-weeks-julelotto-onboarding.png', h: 125, label: 'Jule Lotto onboarding' },
        { id: 'LottoJuleLotto_AddLotto', row: 5, col: 1, span: 2, label: 'Tilføj Lotto?', status: 'pending' },
        { id: 'LottoJuleLotto_Confirm', row: 6, col: 1, img: 'week52-landingpage-lotto-rows-weeks-julelotto-onboarding-addlotto-nej-confirm.png', h: 125, label: 'Bekræftside' },
        { id: 'LottoJuleLotto_Receipt', row: 7, col: 1, img: 'week52-landingpage-lotto-rows-weeks-julelotto-onboarding-addlotto-nej-confirm-receipt.png', h: 166, label: 'En kvittering - Jule Lotto' },
        { id: 'LottoJuleLotto_ConfirmWithLotto', row: 6, col: 2, img: 'week52-landingpage-lotto-rows-weeks-julelotto-onboarding-addlotto-ja-confirm.png', h: 125, label: 'Bekræftside' },
        { id: 'LottoJuleLotto_ReceiptWithLotto', row: 7, col: 2, label: 'To kvitteringer - Jule Lotto og Lotto', status: 'missing' },
        { id: 'LottoJuleLottoAndWeek_Info', row: 4, col: 3, img: 'week52-landingpage-lotto-rows-weeks-julelotto-1uge-onboarding.png', h: 125, label: 'Jule Lotto onboarding' },
        { id: 'LottoJuleLottoAndWeek_Confirm', row: 5, col: 3, img: 'week52-landingpage-lotto-rows-weeks-julelotto-1uge-onboarding-confirm.png', h: 125, label: 'Bekræftside' },
        { id: 'LottoJuleLottoAndWeek_Receipt', row: 6, col: 3, label: 'To kvitteringer - Lotto og Jule Lotto', status: 'missing' },
        { id: 'JuleLotto_Rows', row: 2, col: 4, span: 2, img: 'week52-landingpage-julelotto-rows.png', h: 183, label: 'Antal rækker' },
        { id: 'JuleLotto_Info', row: 3, col: 4, span: 2, img: 'week52-landingpage-julelotto-rows-onboarding.png', h: 125, label: 'Jule Lotto onboarding' },
        { id: 'JuleLotto_LottoDrawUpsell', row: 4, col: 4, span: 2, img: 'week52-landingpage-julelotto-rows-onboarding-upsell.png', h: 125, label: 'Lotto Draw Upsell' },
        { id: 'JuleLotto_Confirm', row: 5, col: 4, img: 'week52-landingpage-julelotto-rows-onboarding-upsell-nej-confirm.png', h: 125, label: 'Bekræftside' },
        { id: 'JuleLotto_Receipt', row: 6, col: 4, img: 'week52-landingpage-julelotto-rows-onboarding-upsell-nej-confirm-receipt.png', h: 166, label: 'En kvittering - Jule Lotto' },
        { id: 'JuleLotto_ConfirmWithLotto', row: 5, col: 5, img: 'week52-landingpage-julelotto-rows-onboarding-upsell-ja-confirm.png', h: 125, label: 'Bekræftside' },
        { id: 'JuleLotto_ReceiptWithLotto', row: 6, col: 5, label: 'To kvitteringer - Jule Lotto og Lotto', status: 'missing' },
      ],
      edges: [
        ['TopSpot', 'LottoJuleLotto_Info', 'Køb nu - 10 rækker'],
        ['LandingPage', 'Lotto_Rows', 'Lotto'],
        ['Lotto_Rows', 'Lotto_Weeks', '10 rækker'],
        ['Lotto_Weeks', 'LottoJuleLotto_Info', 'Jule Lotto'],
        ['LottoJuleLotto_Info', 'LottoJuleLotto_AddLotto', 'Næste'],
        ['LottoJuleLotto_AddLotto', 'LottoJuleLotto_Confirm', 'Nej tak'],
        ['LottoJuleLotto_AddLotto', 'LottoJuleLotto_ConfirmWithLotto', 'Ja tak'],
        ['LottoJuleLotto_Confirm', 'LottoJuleLotto_Receipt', 'Bekræft'],
        ['LottoJuleLotto_ConfirmWithLotto', 'LottoJuleLotto_ReceiptWithLotto', 'Bekræft'],
        ['Lotto_Weeks', 'LottoJuleLottoAndWeek_Info', 'Jule Lotto og 1 uge'],
        ['LottoJuleLottoAndWeek_Info', 'LottoJuleLottoAndWeek_Confirm', 'Næste'],
        ['LottoJuleLottoAndWeek_Confirm', 'LottoJuleLottoAndWeek_Receipt', 'Bekræft'],
        ['LandingPage', 'JuleLotto_Rows', 'Jule Lotto'],
        ['JuleLotto_Rows', 'JuleLotto_Info', '10 rækker'],
        ['JuleLotto_Info', 'JuleLotto_LottoDrawUpsell', 'Næste'],
        ['JuleLotto_LottoDrawUpsell', 'JuleLotto_Confirm', 'Nej tak'],
        ['JuleLotto_LottoDrawUpsell', 'JuleLotto_ConfirmWithLotto', 'Ja tak'],
        ['JuleLotto_Confirm', 'JuleLotto_Receipt', 'Bekræft'],
        ['JuleLotto_ConfirmWithLotto', 'JuleLotto_ReceiptWithLotto', 'Bekræft'],
      ],
    },
  };

  const nodeHtml = (week, node) => {
    const classes = node.status ? `flow__node flow__node--placeholder flow__node--${node.status}` : 'flow__node';
    const badge = node.start ? '<span class="flow__badge">Start</span>' : '';
    const image = node.img
      ? `<button class="flow__zoom" type="button" data-src="julelotto/${node.img}" data-label="${node.label}" aria-label="Forstør ${node.label}" data-uitest-id="julelotto-${week}-${node.id}-zoom">
           <img class="flow__image" src="julelotto/${node.img}" width="200" height="${node.h}" alt="">
         </button>`
      : '';

    return `
      <figure class="${classes}" data-node="${node.id}" style="grid-row: ${node.row}; grid-column: ${node.col} / span ${node.span ?? 1}">
        ${badge}${image}
        <figcaption class="flow__label">${node.label}</figcaption>
      </figure>`;
  };

  // Rounded orthogonal connector from the bottom of one node to the top of another
  const edgeShape = (source, target) => {
    const sx = source.offsetLeft + source.offsetWidth / 2;
    const sy = source.offsetTop + source.offsetHeight;
    const tx = target.offsetLeft + target.offsetWidth / 2;
    const ty = target.offsetTop;
    const my = (sy + ty) / 2;
    const dx = tx - sx;

    if (Math.abs(dx) < 1) {
      return { d: `M ${sx} ${sy} V ${ty}`, x: sx, y: my };
    }

    const r = Math.min(14, Math.abs(dx) / 2, (ty - sy) / 4);
    const dir = Math.sign(dx);
    const d = `M ${sx} ${sy} V ${my - r} Q ${sx} ${my} ${sx + dir * r} ${my} H ${tx - dir * r} Q ${tx} ${my} ${tx} ${my + r} V ${ty}`;

    return { d, x: (sx + tx) / 2, y: my };
  };

  const draw = (grid) => {
    if (!grid.offsetWidth) return;

    const { week } = grid.dataset;
    const node = (id) => grid.querySelector(`[data-node="${id}"]`);
    const shapes = flows[week].edges.map(([from, to, text, dashed]) => ({ from, to, text, dashed, ...edgeShape(node(from), node(to)) }));

    grid.querySelector('.flow__edges').innerHTML = `
      <defs>
        <marker id="${week}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path class="flow__arrow" d="M 0 0 L 10 5 L 0 10 z"/>
        </marker>
        <marker id="${week}-arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path class="flow__arrow flow__arrow--active" d="M 0 0 L 10 5 L 0 10 z"/>
        </marker>
      </defs>
      ${shapes.map(({ from, to, d, dashed }) =>
        `<path class="flow__edge${dashed ? ' flow__edge--dashed' : ''}" d="${d}" data-from="${from}" data-to="${to}" marker-end="url(#${week}-arrow)"/>`).join('')}
    `;

    grid.querySelector('.flow__labels').innerHTML = shapes.map(({ from, to, text, x, y }) =>
      `<span class="flow__edge-label" data-from="${from}" data-to="${to}" style="left: ${x}px; top: ${y}px">${text}</span>`).join('');
  };

  const highlight = (grid, id) => {
    grid.querySelectorAll('[data-from]').forEach((element) => {
      const active = Boolean(id) && (element.dataset.from === id || element.dataset.to === id);

      if (element.tagName === 'path') {
        element.classList.toggle('flow__edge--active', active);
        element.setAttribute('marker-end', `url(#${grid.dataset.week}-arrow${active ? '-active' : ''})`);
      } else {
        element.classList.toggle('flow__edge-label--active', active);
      }
    });
  };

  const resizeObserver = new ResizeObserver((entries) => entries.forEach(({ target }) => draw(target)));

  Object.entries(flows).forEach(([week, { nodes }]) => {
    const columns = Math.max(...nodes.map(({ col, span = 1 }) => col + span - 1));
    const panel = document.getElementById(`panel-${week}`);

    panel.innerHTML = `
      <div class="flow__grid" data-week="${week}" style="grid-template-columns: repeat(${columns}, 216px)">
        <svg class="flow__edges" aria-hidden="true"></svg>
        <div class="flow__labels" aria-hidden="true"></div>
        ${nodes.map((node) => nodeHtml(week, node)).join('')}
      </div>`;

    const grid = panel.querySelector('.flow__grid');
    grid.addEventListener('pointerover', (event) => highlight(grid, event.target.closest('.flow__node')?.dataset.node));
    grid.addEventListener('pointerleave', () => highlight(grid, null));
    resizeObserver.observe(grid);
  });

  window.addEventListener('load', () => document.querySelectorAll('.flow__grid').forEach(draw));

  const lightbox = document.querySelector('.lightbox');

  document.addEventListener('click', (event) => {
    const zoom = event.target.closest('.flow__zoom');
    if (!zoom) return;
    lightbox.querySelector('.lightbox__image').src = zoom.dataset.src;
    lightbox.querySelector('.lightbox__caption').textContent = zoom.dataset.label;
    lightbox.showModal();
  });

  lightbox.addEventListener('click', (event) => {
    if (event.target === lightbox || event.target.closest('.lightbox__close')) lightbox.close();
  });

  const tabs = [...document.querySelectorAll('.tabs__tab')];

  const showWeek = (week) => {
    const active = tabs.find((tab) => tab.dataset.week === week) ?? tabs[0];

    tabs.forEach((tab) => {
      const selected = tab === active;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
    });
  };

  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => {
      history.replaceState(null, '', `#${tab.dataset.week}`);
      showWeek(tab.dataset.week);
    });

    tab.addEventListener('keydown', (event) => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
      if (!step) return;
      const next = tabs[(index + step + tabs.length) % tabs.length];
      next.focus();
      next.click();
    });
  });

  window.addEventListener('hashchange', () => showWeek(location.hash.slice(1)));
  showWeek(location.hash.slice(1));
</script>
